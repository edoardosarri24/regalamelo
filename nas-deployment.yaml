services:
  regalamelo-frontend:
    container_name: regalamelo-frontend
    image: ghcr.io/edoardosarri24/regalamelo-frontend:main
    restart: always
    env_file:
      - nas.env
    environment:
      - VITE_API_BASE_URL=https://regalamelo.edoardosarri.com/api/v1
    depends_on:
      - regalamelo-api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  regalamelo-api:
    container_name: regalamelo-api
    image: ghcr.io/edoardosarri24/regalamelo-backend:main
    restart: always
    command: sh -c "if npx prisma migrate deploy; then echo 'Migrations up to date'; else echo 'Deploy failed, trying to baseline 0_init...' && npx prisma migrate resolve --applied 0_init && npx prisma migrate deploy; fi && exec node dist/index.js"
    env_file:
      - nas.env
    depends_on:
      regalamelo-db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  regalamelo-db:
    container_name: regalamelo-db
    image: postgres:17-alpine
    restart: always
    volumes:
      - NAS_DATABASE_DATA:/var/lib/postgresql/data
    env_file:
      - nas.env
    environment:
      - PGDATA=/var/lib/postgresql/data/pg
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giftlistuser -d giftlistdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  regalamelo-tunnel:
    container_name: regalamelo-tunnel
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    env_file:
      - nas.env
    depends_on:
      - regalamelo-frontend
      - regalamelo-api

  regalamelo-watchtower:
    container_name: regalamelo-watchtower
    image: containrrr/watchtower
    restart: always
    environment:
      - DOCKER_API_VERSION=1.40
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 regalamelo-frontend regalamelo-api

  regalamelo-db-backup:
    container_name: regalamelo-db-backup
    image: prodrigestivill/postgres-backup-local
    restart: always
    volumes:
      - NAS_DATABASE_DATA:/var/lib/postgresql/data:ro
      - ./backups:/backups
    env_file:
      - nas.env
    environment:
      - POSTGRES_HOST=regalamelo-db
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
    depends_on:
      - regalamelo-db

volumes:
  NAS_DATABASE_DATA:
